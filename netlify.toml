[build]
  publish = "."

[[headers]]
  for = "/Acut.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = 'attachment; filename="Acut.apk"'

[[headers]]
  for = "/downloads/Acut.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = 'attachment; filename="Acut.apk"'
